<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المقالات</title>

    <!-- Bootstrap 5 (RTL) + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <a class="back-link" href="../../index.html">→ الرجوع للرئيسية</a>
        <div class="card shadow">

            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-journal-text"></i> إدارة المقالات</h4>
                <span class="badge bg-light text-primary" id="articlesCount">0</span>
            </div>

            <div class="card-body">

                <!-- Create: نموذج إضافة مقال -->
                <form id="articleForm">
                    <div class="mb-3">
                        <label class="form-label" for="title">عنوان المقال</label>
                        <input type="text" class="form-control" id="title" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="content">محتوى المقال</label>
                        <textarea class="form-control" id="content" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <h4 class="mb-0"><i class="bi bi-file-plus"></i> إضافة مقال</h4>
                    </button>
                </form>

                <hr class="my-4">

                <!-- Read: قائمة المقالات -->
                <div id="articlesList"></div>

            </div>
        </div>
    </div>

    <!-- Update: نافذة تعديل المقال -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تعديل المقال</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label" for="editTitle">العنوان</label>
                        <input type="text" class="form-control" id="editTitle">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="editContent">المحتوى</label>
                        <textarea class="form-control" id="editContent" rows="4"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="saveChanges">حفظ التغييرات</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
